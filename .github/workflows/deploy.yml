name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # 1. Continuous Integration Check
  ci-check:
    name: CI - Backend, migrations, build and security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: salon_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: salon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U salon_test -d salon_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_URL: postgresql://salon_test:disposable-ci-password@localhost:5432/salon_test
      POSTGRES_URL_NON_POOLING: postgresql://salon_test:disposable-ci-password@localhost:5432/salon_test
      SALON_TEST_DATABASE_URL: postgresql://salon_test:disposable-ci-password@localhost:5432/salon_test
      SESSION_SECRET: disposable-ci-secret-not-for-production-at-least-32-characters
      NOTIFICATIONS_ENABLED: 'false'
      CALENDAR_SYNC_ENABLED: 'false'
      HOUSEKEEPING_ENABLED: 'false'
      TZ: UTC
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        env:
          DATABASE_URL: "file:./dev.db"
          SESSION_SECRET: ci-test-secret
        run: pnpm lint

      - name: Test
        env:
          # Pin UTC so timezone-sensitive tests (salon-time, DST) behave like CI, not a dev laptop.
          TZ: UTC
          DATABASE_URL: "file:./dev.db"
          SESSION_SECRET: ci-test-secret
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Replay production migrations
        run: pnpm db:vercel:deploy

      - name: Check production migration drift
        run: pnpm exec prisma migrate diff --from-url "$POSTGRES_URL" --to-schema-datamodel prisma/vercel/schema.prisma --exit-code

      - name: Replay SQLite migrations and check drift
        run: |
          sqlite_target=$(mktemp --suffix=.db)
          DATABASE_URL="file:$sqlite_target" pnpm exec prisma migrate deploy --schema prisma/dev/schema.prisma
          DATABASE_URL="file:$sqlite_target" pnpm exec prisma migrate diff --from-url "file:$sqlite_target" --to-schema-datamodel prisma/dev/schema.prisma --exit-code
          rm "$sqlite_target"

      - name: Real PostgreSQL concurrency and rollback checks
        run: pnpm test:integration

      - name: Booking lifecycle and calendar reconciliation checks
        run: pnpm test:booking-lifecycle

      - name: Build against disposable database
        run: pnpm build

      - name: Production HTTP authorization and pagination checks
        run: pnpm test:backend-http

      - name: Type check
        run: pnpm exec tsc --noEmit


  # 2. Deploy Preview (PRs)
  deploy-preview:
    name: Deploy Preview
    needs: ci-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  # 3. Deploy Production (main branch)
  deploy-production:
    name: Deploy to Vercel Production
    needs: ci-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# One run per ref at a time. A newer push to a PR cancels that PR's older run;
# runs on main are never cancelled mid-flight (a half-finished production build
# may already have applied migrations) — they queue, and a queued run is
# superseded by an even newer one. On its own this still lets an older commit
# deploy last, so deploy-production also re-checks that it is main's head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1. Continuous Integration Check
  ci-check:
    name: CI - Backend, migrations, build and security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: salon_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: salon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U salon_test -d salon_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_URL: postgresql://salon_test:disposable-ci-password@localhost:5432/salon_test
      POSTGRES_URL_NON_POOLING: postgresql://salon_test:disposable-ci-password@localhost:5432/salon_test
      SALON_TEST_DATABASE_URL: postgresql://salon_test:disposable-ci-password@localhost:5432/salon_test
      SESSION_SECRET: disposable-ci-secret-not-for-production-at-least-32-characters
      NOTIFICATIONS_ENABLED: 'false'
      CALENDAR_SYNC_ENABLED: 'false'
      HOUSEKEEPING_ENABLED: 'false'
      TZ: UTC
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install 3D demo dependencies
        run: pnpm --dir demos/harbour-hair-3d install --frozen-lockfile

      - name: Lint
        env:
          DATABASE_URL: "file:./dev.db"
          SESSION_SECRET: ci-test-secret
        run: pnpm lint

      - name: Test
        env:
          # Pin UTC so timezone-sensitive tests (salon-time, DST) behave like CI, not a dev laptop.
          TZ: UTC
          DATABASE_URL: "file:./dev.db"
          SESSION_SECRET: ci-test-secret
        run: pnpm test

      - name: Test 3D demo
        run: pnpm demo:test

      - name: Build and verify standalone 3D demo
        run: |
          pnpm demo:build
          git ls-files --error-unmatch public/harbour-hair-3d.html
          git diff --exit-code --stat -- public/harbour-hair-3d.html

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: 3D demo dependency audit
        run: pnpm --dir demos/harbour-hair-3d audit --audit-level=high

      - name: Replay production migrations
        run: pnpm db:vercel:deploy

      - name: Check production migration drift
        run: pnpm exec prisma migrate diff --from-url "$POSTGRES_URL" --to-schema-datamodel prisma/vercel/schema.prisma --exit-code

      - name: Replay SQLite migrations and check drift
        run: |
          sqlite_target=$(mktemp --suffix=.db)
          DATABASE_URL="file:$sqlite_target" pnpm exec prisma migrate deploy --schema prisma/dev/schema.prisma
          DATABASE_URL="file:$sqlite_target" pnpm exec prisma migrate diff --from-url "file:$sqlite_target" --to-schema-datamodel prisma/dev/schema.prisma --exit-code
          rm "$sqlite_target"

      - name: Real PostgreSQL concurrency and rollback checks
        run: pnpm test:integration

      - name: Booking lifecycle and calendar reconciliation checks
        run: pnpm test:booking-lifecycle

      - name: Build against disposable database
        run: pnpm build

      - name: Production HTTP authorization and pagination checks
        run: pnpm test:backend-http

      - name: Type check
        run: pnpm exec tsc --noEmit


  # 2. Deploy Preview (PRs)
  deploy-preview:
    name: Deploy Preview
    needs: ci-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Vercel CLI
        # Pinned: an unpinned CLI changes under us between two deploys. Bump on purpose.
        run: pnpm add -g vercel@63.1.2

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  # 3. Deploy Production (main branch)
  deploy-production:
    name: Deploy to Vercel Production
    needs: ci-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      # Optional pre-migration snapshot (see the step below). Unset = skipped.
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Several merges seconds apart each start a run, and whichever deploys
      # last wins production — possibly an older commit (2026-09-29: five
      # pushes in 19 s). Only main's current head may build (the build applies
      # migrations) or deploy; an older run stops here and the newest run ships
      # everything. Checked again right before the deploy step.
      - name: Check this commit is still main's head
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $head; skipping the deploy of $GITHUB_SHA (the newer run deploys it)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node.js
        if: steps.head.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        if: steps.head.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Vercel CLI
        if: steps.head.outputs.deploy == 'true'
        # Pinned: an unpinned CLI changes under us between two deploys. Bump on purpose.
        run: pnpm add -g vercel@63.1.2

      - name: Pull Vercel Environment
        if: steps.head.outputs.deploy == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # The build below runs `prisma migrate deploy` against production. When
      # the NEON_API_KEY secret and NEON_PROJECT_ID variable are set, first take
      # a compute-less Neon branch of the production database (instant,
      # copy-on-write, no CU-hours) so a bad migration can be undone even after
      # the free plan's 6-hour restore window. Keeps the newest three.
      - name: Snapshot the production database
        if: steps.head.outputs.deploy == 'true' && env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != ''
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          name="predeploy-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          curl -fsS -X POST "$api" -H "Authorization: Bearer $NEON_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"branch\":{\"name\":\"$name\"}}" > /dev/null
          echo "Created Neon branch $name"
          curl -fsS "$api" -H "Authorization: Bearer $NEON_API_KEY" \
            | jq -r '[.branches[] | select(.name | startswith("predeploy-"))] | sort_by(.created_at) | reverse | .[3:][] | .id' \
            | while read -r id; do
                curl -fsS -X DELETE "$api/$id" -H "Authorization: Bearer $NEON_API_KEY" > /dev/null
                echo "Deleted old snapshot branch $id"
              done

      - name: Build
        if: steps.head.outputs.deploy == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Check this commit is still main's head
        id: head_again
        if: steps.head.outputs.deploy == 'true'
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved to $head during the build; leaving production to that run."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Production
        if: steps.head_again.outputs.deploy == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
